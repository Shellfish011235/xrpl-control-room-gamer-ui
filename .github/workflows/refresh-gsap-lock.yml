name: Refresh GSAP lockfile

on:
  push:
    branches:
      - feature/network-topology-transparency
    paths:
      - package.json
      - .github/workflows/refresh-gsap-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/network-topology-transparency
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "chore: refresh package lock for GSAP"
            git push origin HEAD:feature/network-topology-transparency
          fi
